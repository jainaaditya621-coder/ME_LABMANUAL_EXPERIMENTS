<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>
<body>
    <fieldset style="border: 3px solid black; padding: 30px; margin: 50px;">
        <h1 align="center">Hotel Room Booking Form</h1>
        <form align="center">
            <label>Full Name:</label>
            <input type="text" name="fullname">
            <br><br>
            <label>Email:</label>
            <input type="email" name="email">
            <br><br>
            <label>Phone:</label>
            <input type="tel" name="phone">
            <br><br>
            <label>Check-in Date:</label>
            <input type="date" name="checkin">
            <br><br>
            <label>Check-out Date:</label>
            <input type="date" name="checkout">
            <br><br>
            <label>Room Type:</label>
            <select name="roomtype">
                <option>Single Room</option>
                <option>Double Room</option>
                <option>Deluxe Room</option>
                <option>Suite</option>
            </select>
            <br><br>
            <label>Number of Guests:</label>
            <input type="number" name="guests" min="1">
            <br><br>
            <label>Special Requests:</label>
            <br>
            <textarea name="requests" rows="5" cols="50"></textarea>
            <br><br>
            <input type="submit" value="Book Now">
            <input type="reset" value="Reset Form">
        </form>
    </fieldset>
</body>
</html>
